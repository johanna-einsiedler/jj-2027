<script>
(function () {
  var P = { salt: '1JXVsC6xoLpFzn7ekbNRJw==', iv: 'WJtcUAKugSmq7zjp', iterations: 600000 };
  var KEY = 'jj-pw';
  var form = document.getElementById('gate');
  var input = document.getElementById('pw');
  var btn = document.getElementById('go');
  var msg = document.getElementById('msg');
  var label = btn.textContent;

  function bytes(s) {
    var b = atob(s), u = new Uint8Array(b.length);
    for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
    return u;
  }
  function store(fn) { try { return fn(window.localStorage); } catch (e) { return null; } }
  function say(text) { msg.textContent = text; msg.hidden = false; }

  // Wirft bei falschem Passwort (AES-GCM prüft die Integrität)
  async function decrypt(pw) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: bytes(P.salt), iterations: P.iterations, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.iv) }, key,
      bytes(document.getElementById('payload').textContent.trim()));
    return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  }
  function show(html) {
    document.open();
    document.write(html);
    document.close();
  }
  async function attempt(pw, quiet) {
    btn.disabled = true;
    btn.textContent = 'Einen Moment … · One moment …';
    msg.hidden = true;
    try {
      var html = await decrypt(pw);
      store(function (s) { s.setItem(KEY, pw); });
      show(html);
    } catch (e) {
      btn.disabled = false;
      btn.textContent = label;
      if (quiet) { store(function (s) { s.removeItem(KEY); }); return; }
      say('Das Passwort stimmt leider nicht. · That password isn’t right.');
      input.select();
    }
  }

  if (!window.crypto || !crypto.subtle || typeof DecompressionStream === 'undefined') {
    say('Bitte öffnet die Seite in einem aktuellen Browser. · Please open this page in an up-to-date browser.');
    btn.disabled = true;
    return;
  }
  form.addEventListener('submit', function (e) { e.preventDefault(); attempt(input.value, false); });
  var saved = store(function (s) { return s.getItem(KEY); });
  if (saved) attempt(saved, true);
})();
</script>
